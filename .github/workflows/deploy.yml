# Builds the site with Vite and publishes it on GitHub.
# Put this file at .github/workflows/deploy.yml in your repository.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # AI Studio's package.json can pin package versions that disagree with each other, which stops a plain npm install.
      - run: npm install --legacy-peer-deps
      - id: pages
        uses: actions/configure-pages@v5
      # Vite alone, so a TypeScript type error in generated code doesn't block publishing.
      # The base is "/" for a your-name.github.io repository and "/repo-name/" for any other name.
      - run: npx vite build --base="${{ steps.pages.outputs.base_path }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
